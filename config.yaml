# blog-agent configuration

# 기본 저장 경로 설정 (노션 프로퍼티 기반으로 동적 확장 가능)
mapping:
  default:
    # 마크다운 파일이 저장될 로컬 디렉토리
    post_dir: "../wholmesian.github.io/_posts"
    # 다운로드한 이미지가 저장될 로컬 디렉토리
    image_dir: "../wholmesian.github.io/_site/assets/images/posts_img/"
    # 마크다운 본문에 삽입될 웹루트 절대 경로
    image_web_root: "/assets/images/posts_img/"

# Gemini 모델 설정
gemini:
  model_name: "gemini-2.5-flash"
  temperature: 0.2
  # system_instruction_file을 통해 긴 프롬프트를 별도의 마크다운 파일에서 관리할 수 있습니다.
  system_instruction_file: "AGENTS.md"
