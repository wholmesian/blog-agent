[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blog-agent"
version = "0.2.0"
description = "Tools for managing the wholmesian.github.io Jekyll blog (Notion -> Jekyll), usable via CLI or MCP"
requires-python = ">=3.10"
dependencies = [
    "notion-client>=2.2.1",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "mcp[cli]>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
blog-agent = "blog_manager.cli:main"
blog-agent-mcp = "blog_manager.mcp_server:main"

[tool.setuptools]
packages = ["blog_manager"]
